name: 提交检查

on:
  # 主分支每次推送和每个合并请求都自动执行；正式发布会校验对应提交已通过本检查。
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # 主分支每个提交都要保留完整结果供发布校验，只有合并请求的新推送会取消旧运行。
  group: check-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 格式检查与共享测试
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "21"
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
      - name: 校验 Desktop OCR 模型锁
        run: python3 tools/desktop-ocr/convert_ppocrv5.py --verify-lock-only
      - name: 运行格式检查、JVM 测试与 Android 宿主测试
        run: ./gradlew spotlessCheck jvmTest testAndroidHostTest
