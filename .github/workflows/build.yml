name: 构建验证

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-macos:
    name: Android、macOS 与 iOS 共享代码
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "21"
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: 校验 Desktop OCR 模型锁
        run: python3 tools/desktop-ocr/convert_ppocrv5.py --verify-lock-only
      - name: 运行格式检查和共享测试矩阵
        run: ./gradlew spotlessCheck jvmTest testAndroidHostTest iosSimulatorArm64Test
      - name: 构建 Android 调试包
        run: ./gradlew :androidApp:assembleDebug
      - name: 构建 macOS 分发包
        run: ./gradlew :desktopApp:packageDmg
      - name: 验证 macOS 成品本地 OCR
        run: ./gradlew :desktopApp:verifyPackagedOnnxRuntime :desktopApp:verifyPackagedDesktopOcr
      - name: 编译 iOS 模拟器共享框架
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64

  windows:
    name: Windows x64 桌面包与本地 OCR
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 配置 Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "21"
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: 校验 Desktop OCR 模型锁
        run: python tools/desktop-ocr/convert_ppocrv5.py --verify-lock-only
      - name: 运行共享测试
        run: .\gradlew.bat jvmTest
      - name: 构建并验证 Windows MSI
        run: .\gradlew.bat :desktopApp:verifyPackagedWindowsMsi
      - name: 验证 Windows 成品本地 OCR
        run: .\gradlew.bat :desktopApp:verifyPackagedOnnxRuntime :desktopApp:verifyPackagedDesktopOcr
