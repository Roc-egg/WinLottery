name: 发布版本

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: dry-run 仅验证并上传临时产物，publish 才创建正式 Release
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
      tag:
        description: publish 模式必填已存在的稳定版本标签，例如 v1.4.0
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref_name }}-${{ inputs.mode }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: 校验发布标签与版本
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      build_number: ${{ steps.release.outputs.build_number }}
      commit: ${{ steps.release.outputs.commit }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: 校验版本元数据
        id: release
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.ref_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          head_commit="$(git rev-parse HEAD)"
          android_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' androidApp/build.gradle.kts)"
          android_build="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\).*/\1/p' androidApp/build.gradle.kts)"
          ios_version="$(sed -n 's/^MARKETING_VERSION=\(.*\)$/\1/p' iosApp/Configuration/Config.xcconfig)"
          ios_build="$(sed -n 's/^CURRENT_PROJECT_VERSION=\([0-9][0-9]*\)$/\1/p' iosApp/Configuration/Config.xcconfig)"

          if [[ ! "$android_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$android_version" != "$ios_version" ]]; then
            echo "::error title=版本号不一致::Android 与 iOS 必须使用相同的 X.Y.Z 版本号"
            exit 1
          fi
          if [[ -z "$android_build" || "$android_build" != "$ios_build" ]]; then
            echo "::error title=构建号不一致::Android versionCode 与 iOS CURRENT_PROJECT_VERSION 必须一致"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$head_commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error title=提交不属于主分支::仅允许验证默认分支历史中的提交"
            exit 1
          fi

          publish=true
          requested_tag="$EVENT_TAG"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_MODE" == "publish" ]]; then
              requested_tag="$INPUT_TAG"
              if [[ -z "$requested_tag" ]]; then
                echo "::error title=缺少版本标签::publish 模式必须填写已存在的稳定版本标签"
                exit 1
              fi
            else
              publish=false
              requested_tag="v${android_version}-dry-run-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
            fi
          fi

          if [[ "$publish" == "true" ]]; then
            if [[ ! "$requested_tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error title=版本标签不合法::正式发布仅接受 vX.Y.Z 格式的稳定版本标签"
              exit 1
            fi
            tag_version="${BASH_REMATCH[1]}"
            if [[ "$tag_version" != "$android_version" ]]; then
              echo "::error title=版本号不一致::标签、Android 与 iOS 版本号必须完全一致"
              exit 1
            fi
            if ! tag_commit="$(git rev-parse --verify "refs/tags/${requested_tag}^{commit}" 2>/dev/null)"; then
              echo "::error title=版本标签不存在::没有找到标签 $requested_tag"
              exit 1
            fi
            if [[ "$head_commit" != "$tag_commit" ]]; then
              echo "::error title=标签提交不一致::工作区不是指定标签对应的提交"
              exit 1
            fi
          fi

          {
            echo "tag=$requested_tag"
            echo "version=$android_version"
            echo "build_number=$android_build"
            echo "commit=$head_commit"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 发布元数据"
            if [[ "$publish" == "true" ]]; then
              echo "- 模式：正式发布"
            else
              echo "- 模式：手动演练，不创建 GitHub Release"
            fi
            echo "- 标识：\`$requested_tag\`"
            echo "- 版本：\`$android_version ($android_build)\`"
            echo "- 提交：\`$head_commit\`"
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: 跨平台 Release 验证与 iOS 打包
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 70
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      ios_bundle_id: ${{ steps.ios_package.outputs.bundle_id }}
      ios_minimum_version: ${{ steps.ios_package.outputs.minimum_os }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: 配置 Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          cache-read-only: true

      - name: 校验 Desktop OCR 模型锁
        run: python3 tools/desktop-ocr/convert_ppocrv5.py --verify-lock-only

      - name: 运行格式检查和共享测试矩阵
        run: ./gradlew spotlessCheck jvmTest testAndroidHostTest iosSimulatorArm64Test --console=plain

      - name: 构建 iOS Simulator Release
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_BUILD: ${{ needs.metadata.outputs.build_number }}
        run: |
          set -euo pipefail

          derived_data="$RUNNER_TEMP/WinLottery-ios-release"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            build

          app="$derived_data/Build/Products/Release-iphonesimulator/WinLottery.app"
          info_plist="$app/Info.plist"
          executable="$app/WinLottery"
          [[ -f "$info_plist" && -f "$executable" ]] || {
            echo "::error title=iOS Release 缺失::没有找到完整的 Simulator Release 应用"
            exit 1
          }

          actual_version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
          actual_build="$(plutil -extract CFBundleVersion raw "$info_plist")"
          [[ "$actual_version" == "$EXPECTED_VERSION" && "$actual_build" == "$EXPECTED_BUILD" ]] || {
            echo "::error title=iOS 产物版本不一致::实际版本为 $actual_version ($actual_build)"
            exit 1
          }
          file "$executable" | grep -Fq "arm64" || {
            echo "::error title=iOS 架构不正确::Simulator Release 不是 arm64 架构"
            exit 1
          }

          {
            echo "### 跨平台验证"
            echo "- 共享测试矩阵：通过"
            echo "- iOS Simulator Release：\`$actual_version ($actual_build)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 构建 iOS 未签名真机 IPA
        id: ios_package
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_BUILD: ${{ needs.metadata.outputs.build_number }}
        run: |
          set -euo pipefail

          derived_data="$RUNNER_TEMP/WinLottery-ios-device-release"
          ipa_root="$RUNNER_TEMP/WinLottery-ios-unsigned-ipa"
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

          app="$derived_data/Build/Products/Release-iphoneos/WinLottery.app"
          info_plist="$app/Info.plist"
          executable="$app/WinLottery"
          [[ -f "$info_plist" && -f "$executable" ]] || {
            echo "::error title=iOS 真机 Release 缺失::没有找到完整的 iphoneos Release 应用"
            exit 1
          }

          actual_version="$(plutil -extract CFBundleShortVersionString raw "$info_plist")"
          actual_build="$(plutil -extract CFBundleVersion raw "$info_plist")"
          bundle_id="$(plutil -extract CFBundleIdentifier raw "$info_plist")"
          minimum_os="$(plutil -extract MinimumOSVersion raw "$info_plist")"
          [[ "$actual_version" == "$EXPECTED_VERSION" && "$actual_build" == "$EXPECTED_BUILD" ]] || {
            echo "::error title=iOS 真机产物版本不一致::实际版本为 $actual_version ($actual_build)"
            exit 1
          }
          file "$executable" | grep -Fq "arm64" || {
            echo "::error title=iOS 真机架构不正确::iphoneos Release 不是 arm64 架构"
            exit 1
          }
          xcrun vtool -show-build "$executable" | grep -Eq 'platform +IOS$' || {
            echo "::error title=iOS 平台不正确::真机 IPA 中的可执行文件不是 iphoneos 平台"
            exit 1
          }
          if codesign --verify --deep --strict "$app" >/dev/null 2>&1; then
            echo "::error title=iOS 产物意外签名::待用户自行签名的 IPA 不应预置应用签名"
            exit 1
          fi
          [[ ! -e "$app/embedded.mobileprovision" ]] || {
            echo "::error title=iOS 描述文件残留::未签名 IPA 不应包含 embedded.mobileprovision"
            exit 1
          }

          mkdir -p "$ipa_root/Payload" "$GITHUB_WORKSPACE/release-assets"
          ditto "$app" "$ipa_root/Payload/WinLottery.app"
          asset="$GITHUB_WORKSPACE/release-assets/WinLottery-v${EXPECTED_VERSION}-ios-arm64-unsigned.ipa"
          (
            cd "$ipa_root"
            /usr/bin/zip -qry "$asset" Payload
          )
          [[ -s "$asset" ]] || {
            echo "::error title=iOS IPA 缺失::未生成可下载的未签名 IPA"
            exit 1
          }
          unzip -tq "$asset"
          unzip -Z1 "$asset" | grep -Fxq "Payload/WinLottery.app/Info.plist" || {
            echo "::error title=iOS IPA 结构不完整::IPA 中缺少应用 Info.plist"
            exit 1
          }
          unzip -Z1 "$asset" | grep -Fxq "Payload/WinLottery.app/WinLottery" || {
            echo "::error title=iOS IPA 结构不完整::IPA 中缺少应用可执行文件"
            exit 1
          }

          {
            echo "bundle_id=$bundle_id"
            echo "minimum_os=$minimum_os"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### iOS 未签名真机产物"
            echo "- IPA：\`$actual_version ($actual_build)\`"
            echo "- Bundle ID：\`$bundle_id\`"
            echo "- 架构：\`arm64\`"
            echo "- 最低系统：\`iOS $minimum_os\`"
            echo "- 安装要求：必须由使用者使用自己的有效证书和描述文件重新签名"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成 iOS 构建来源证明
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*.ipa

      - name: 上传 iOS 发布候选产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-ios
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  android_release:
    name: 构建 Android Release
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      certificate_sha256: ${{ steps.android_package.outputs.certificate_sha256 }}
    steps:
      - name: 检出发布代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false

      - name: 配置 Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: zulu
          java-version: "21"

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@67621b124fd2e251c5e8a0e6e3b91318f2287669 # v6.3.0
        with:
          cache-read-only: true

      - name: 构建 Android Release APK
        run: ./gradlew :androidApp:assembleRelease --console=plain

      - name: 校验并整理 Android 发布产物
        id: android_package
        env:
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
          EXPECTED_BUILD: ${{ needs.metadata.outputs.build_number }}
        run: |
          set -euo pipefail

          apk="androidApp/build/outputs/apk/release/androidApp-release.apk"
          [[ -f "$apk" ]] || {
            echo "::error title=Android Release 缺失::没有找到 APK"
            exit 1
          }

          build_tools="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)"
          apksigner="$build_tools/apksigner"
          aapt2="$build_tools/aapt2"
          [[ -x "$apksigner" && -x "$aapt2" ]] || {
            echo "::error title=Android 工具缺失::没有找到 apksigner 或 aapt2"
            exit 1
          }

          "$apksigner" verify --verbose "$apk"

          badging="$("$aapt2" dump badging "$apk")"
          grep -Fq "versionName='$EXPECTED_VERSION'" <<< "$badging" || {
            echo "::error title=Android 版本号不一致::APK versionName 不符合标签"
            exit 1
          }
          grep -Fq "versionCode='$EXPECTED_BUILD'" <<< "$badging" || {
            echo "::error title=Android 构建号不一致::APK versionCode 不符合配置"
            exit 1
          }
          if grep -Fxq "application-debuggable" <<< "$badging"; then
            echo "::error title=Release 可调试::APK 清单仍包含 application-debuggable"
            exit 1
          fi

          apk_abis="$(unzip -Z1 "$apk" | sed -n 's#^lib/\([^/]*\)/.*#\1#p' | sort -u | paste -sd, -)"
          [[ "$apk_abis" == "arm64-v8a" ]] || {
            echo "::error title=Android ABI 不符合要求::APK=$apk_abis"
            exit 1
          }

          apk_certificate="$RUNNER_TEMP/winlottery-release-apk.pem"
          "$apksigner" verify --print-certs-pem "$apk" |
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' > "$apk_certificate"
          [[ -s "$apk_certificate" ]] || {
            echo "::error title=Android 签名证书缺失::无法从 APK 提取签名证书"
            exit 1
          }

          apk_digest="$(openssl x509 -in "$apk_certificate" -outform DER | sha256sum | awk '{print $1}')"
          [[ -n "$apk_digest" ]] || {
            echo "::error title=Android 签名摘要缺失::无法计算 APK 证书 SHA-256"
            exit 1
          }

          asset_prefix="WinLottery-v${EXPECTED_VERSION}-android-arm64-v8a"
          mkdir -p release-assets
          cp "$apk" "release-assets/${asset_prefix}.apk"
          echo "certificate_sha256=$apk_digest" >> "$GITHUB_OUTPUT"

          {
            echo "### Android 发布产物"
            echo "- APK：\`$EXPECTED_VERSION ($EXPECTED_BUILD)\`"
            echo "- ABI：\`arm64-v8a\`"
            echo "- 证书 SHA-256：\`$apk_digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 生成构建来源证明
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*.apk

      - name: 上传发布候选产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-android
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release_assets:
    name: 汇总发布资产
    needs:
      - metadata
      - verify
      - android_release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: 下载 Android 发布候选产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-android
          path: release-assets

      - name: 下载 iOS 发布候选产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-ios
          path: release-assets

      - name: 生成并复核发布清单
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_BUILD: ${{ needs.metadata.outputs.build_number }}
          RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
          ANDROID_CERTIFICATE_SHA256: ${{ needs.android_release.outputs.certificate_sha256 }}
          IOS_BUNDLE_ID: ${{ needs.verify.outputs.ios_bundle_id }}
          IOS_MINIMUM_VERSION: ${{ needs.verify.outputs.ios_minimum_version }}
        run: |
          set -euo pipefail

          android_apk="WinLottery-v${RELEASE_VERSION}-android-arm64-v8a.apk"
          ios_ipa="WinLottery-v${RELEASE_VERSION}-ios-arm64-unsigned.ipa"
          [[ -f "release-assets/$android_apk" && -f "release-assets/$ios_ipa" ]] || {
            echo "::error title=发布资产不完整::必须同时包含 Android APK 和 iOS 未签名 IPA"
            exit 1
          }
          [[ -n "$ANDROID_CERTIFICATE_SHA256" && -n "$IOS_BUNDLE_ID" && -n "$IOS_MINIMUM_VERSION" ]] || {
            echo "::error title=发布元数据不完整::缺少 Android 签名或 iOS 应用信息"
            exit 1
          }

          {
            echo "tag=$RELEASE_TAG"
            echo "version=$RELEASE_VERSION"
            echo "build_number=$RELEASE_BUILD"
            echo "commit=$RELEASE_COMMIT"
            echo "android_abi=arm64-v8a"
            echo "android_certificate_sha256=$ANDROID_CERTIFICATE_SHA256"
            echo "ios_bundle_id=$IOS_BUNDLE_ID"
            echo "ios_minimum_version=$IOS_MINIMUM_VERSION"
            echo "ios_arch=arm64"
            echo "ios_signing=unsigned"
            echo "ios_installation=requires_user_signing"
          } > release-assets/RELEASE-METADATA.txt
          (
            cd release-assets
            sha256sum "$android_apk" "$ios_ipa" RELEASE-METADATA.txt > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

          {
            echo "### 完整发布资产"
            echo "- Android：签名 APK，\`arm64-v8a\`"
            echo "- iOS：未签名真机 IPA，\`arm64\`，最低 iOS \`$IOS_MINIMUM_VERSION\`"
            echo "- SHA-256 清单：通过"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传完整发布候选产物
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    name: 创建 GitHub Release
    needs:
      - metadata
      - release_assets
    if: needs.metadata.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    environment:
      name: github-release
      url: ${{ steps.publish.outputs.url }}
    steps:
      - name: 下载已验证产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-release
          path: release-assets

      - name: 复核发布校验和
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: 创建不可覆盖的稳定版本
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_NOTES: |
            Android 提供仅含 arm64-v8a 原生库的签名 APK。

            iOS 提供面向 arm64 真机的未签名 IPA。该文件不能直接安装，使用者必须使用自己的有效证书和描述文件重新签名；第三方签名工具的安全性与兼容性需由使用者自行判断。

            安装前请使用 SHA256SUMS.txt 核对文件完整性。
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error title=版本已发布::标签 $RELEASE_TAG 已存在 GitHub Release，不允许覆盖既有资产"
            exit 1
          fi

          release_url="$(gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --fail-on-no-commits \
            --title "WinLottery $VERSION" \
            --generate-notes \
            --notes "$RELEASE_NOTES")"
          echo "url=$release_url" >> "$GITHUB_OUTPUT"
          echo "### 已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "$release_url" >> "$GITHUB_STEP_SUMMARY"

  dry-run:
    name: 发布演练检查
    needs:
      - metadata
      - release_assets
    if: needs.metadata.outputs.publish != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: 下载演练产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WinLottery-${{ needs.metadata.outputs.tag }}-release
          path: release-assets

      - name: 复核演练产物校验和
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: 记录演练结果
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          {
            echo "### 发布演练通过"
            echo "- 标识：\`$RELEASE_TAG\`"
            echo "- Android 签名 APK 已完成构建、验签、上传、下载与校验"
            echo "- iOS arm64 未签名真机 IPA 已完成构建、上传、下载与校验"
            echo "- 跨平台 Release 与 Simulator 验证已通过"
            echo "- 未创建标签或 GitHub Release"
          } >> "$GITHUB_STEP_SUMMARY"
